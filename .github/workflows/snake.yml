# Save this file in your zRuvix/zRuvix repo at: .github/workflows/snake.yml
#
# It draws your contribution graph as a purple snake animation
# and saves the images on a branch called "output".

name: Generate contribution snake

on:
  # runs once a day
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # also runs when you push to the main branch (so it starts right after you add this file)
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: first color = 0 contributions, then low to high
          outputs: |
            dist/github-snake-dark.svg?color_snake=#f5d0fe&color_dots=#1a1030,#4c1d95,#6d28d9,#8b5cf6,#c084fc
            dist/github-snake.svg?color_snake=#3b0764&color_dots=#ede9fe,#c4b5fd,#a78bfa,#7c3aed,#4c1d95
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
